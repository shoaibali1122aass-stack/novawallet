name: NovaWallet wallet notifications

on:
  repository_dispatch:
    types: [send-notification]

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send deposit / withdrawal / swap email
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          TO_EMAIL: ${{ github.event.client_payload.email }}
          KIND: ${{ github.event.client_payload.kind }}
          TITLE: ${{ github.event.client_payload.title }}
          BODY: ${{ github.event.client_payload.body }}
        run: |
          python3 - <<'PY'
          import html
          import os
          import smtplib
          import ssl
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText
          from email.utils import formatdate, make_msgid

          user = os.environ["MAIL_USER"]
          password = os.environ["MAIL_PASS"]
          to_email = os.environ["TO_EMAIL"]
          kind = (os.environ.get("KIND") or "system").strip().lower()
          title = (os.environ.get("TITLE") or "NovaWallet update").strip()
          body = (os.environ.get("BODY") or "You have a new wallet notification.").strip()

          meta = {
              "deposit": ("Deposit received", "#34d399", "INCOMING DEPOSIT"),
              "withdrawal": ("Withdrawal update", "#f59e0b", "OUTGOING TRANSFER"),
              "swap": ("Swap update", "#38bdf8", "TOKEN SWAP"),
          }
          subject_label, accent, badge = meta.get(kind, ("Wallet update", "#38bdf8", "WALLET ACTIVITY"))
          subject = "NovaWallet — " + subject_label

          safe_title = html.escape(title)
          safe_body = html.escape(body)

          html_body = """<div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;max-width:480px;margin:20px auto;padding:32px 24px;border-radius:18px;background:linear-gradient(180deg,#0f172a 0%,#020617 100%);border:1px solid #1e293b;color:#f3f4f6;">
          <div style="text-align:center;margin-bottom:22px;"><h1 style="margin:0;font-size:26px;font-weight:800;letter-spacing:2px;text-transform:uppercase;"><span style="color:#f43f5e;">NOVA</span><span style="color:#f59e0b;">WALLET</span></h1>
          <div style="margin-top:10px;display:inline-block;background:rgba(56,189,248,0.08);border:1px solid rgba(56,189,248,0.4);border-radius:30px;padding:6px 16px;"><span style="font-size:11px;letter-spacing:1.5px;color:__ACCENT__;font-weight:700;text-transform:uppercase;">__BADGE__</span></div></div>
          <p style="margin:0 0 14px;font-size:16px;color:#fff;">Hello,</p>
          <p style="margin:0 0 18px;font-size:14px;line-height:1.6;color:#cbd5e1;">Activity was detected on your NovaWallet account:</p>
          <div style="background:#0b1220;border:1.5px solid __ACCENT__;border-left:4px solid __ACCENT__;border-radius:14px;padding:18px;margin:22px 0;">
          <div style="font-size:16px;font-weight:800;color:#fff;margin-bottom:8px;">__TITLE__</div>
          <div style="font-size:14px;line-height:1.6;color:#cbd5e1;">__BODY__</div></div>
          <p style="margin:0 0 16px;font-size:13px;line-height:1.6;color:#94a3b8;">Open your dashboard to see the full details, balances and transaction status.</p>
          <p style="margin:0 0 22px;font-size:12px;line-height:1.5;color:#64748b;border-left:2px solid #f43f5e;padding-left:12px;">If you did not expect this activity, sign in, review your security settings and contact support immediately.</p>
          <div style="padding-top:20px;border-top:1px solid #1e293b;font-size:13px;color:#94a3b8;text-align:center;">Best regards,<br><strong style="color:#fff;">NovaWallet Security Team</strong></div></div>"""
          html_body = (
              html_body.replace("__ACCENT__", accent)
              .replace("__BADGE__", badge)
              .replace("__TITLE__", safe_title)
              .replace("__BODY__", safe_body)
          )

          text = (
              title + "\n\n"
              + body + "\n\n"
              + "Open your NovaWallet dashboard for full details.\n"
              + "If you did not expect this activity, review your security settings and contact support.\n"
          )

          msg = MIMEMultipart("alternative")
          msg["Subject"] = subject
          msg["From"] = "NovaWallet <" + user + ">"
          msg["To"] = to_email
          msg["Reply-To"] = user
          msg["Date"] = formatdate(localtime=True)
          msg["Message-ID"] = make_msgid(domain="gmail.com")
          msg.attach(MIMEText(text, "plain", "utf-8"))
          msg.attach(MIMEText(html_body, "html", "utf-8"))

          with smtplib.SMTP("smtp.gmail.com", 587, timeout=30) as server:
              server.ehlo()
              server.starttls(context=ssl.create_default_context())
              server.ehlo()
              server.login(user, password)
              server.sendmail(user, [to_email], msg.as_string())

          print("Wallet notification sent: " + kind + " -> " + to_email)
          PY
