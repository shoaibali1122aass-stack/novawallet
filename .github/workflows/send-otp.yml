name: NovaWallet OTP

on:
  repository_dispatch:
    types: [send-otp]

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send verification code
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          TO_EMAIL: ${{ github.event.client_payload.email }}
          OTP_CODE: ${{ github.event.client_payload.code }}
        run: |
          python3 - <<'PY'
          import os
          import smtplib
          import ssl
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText
          from email.utils import formatdate, make_msgid

          user = os.environ["MAIL_USER"]
          password = os.environ["MAIL_PASS"]
          to_email = os.environ["TO_EMAIL"]
          code = os.environ["OTP_CODE"]

          html = """<div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;max-width:480px;margin:20px auto;padding:32px 24px;border-radius:18px;background:linear-gradient(180deg,#0f172a 0%,#020617 100%);border:1px solid #1e293b;color:#f3f4f6;">
          <div style="text-align:center;margin-bottom:22px;"><h1 style="margin:0;font-size:26px;font-weight:800;letter-spacing:2px;text-transform:uppercase;"><span style="color:#f43f5e;">NOVA</span><span style="color:#f59e0b;">WALLET</span></h1>
          <div style="margin-top:10px;display:inline-block;background:rgba(56,189,248,0.08);border:1px solid rgba(56,189,248,0.4);border-radius:30px;padding:6px 16px;"><span style="font-size:11px;letter-spacing:1.5px;color:#38bdf8;font-weight:700;text-transform:uppercase;">SECURE NON-CUSTODIAL WALLET</span></div></div>
          <p style="margin:0 0 14px;font-size:16px;color:#fff;">Hello,</p>
          <p style="margin:0 0 18px;font-size:14px;line-height:1.6;color:#cbd5e1;">Use the following One-Time Password (OTP) to sign in to NovaWallet:</p>
          <div style="background:radial-gradient(circle,#0b2a3a 0%,#061117 100%);border:1.5px solid #38bdf8;border-radius:14px;padding:22px 12px;text-align:center;margin:24px 0;box-shadow:0 0 25px rgba(56,189,248,0.28);">
          <div style="margin-bottom:8px;font-size:11px;letter-spacing:1.5px;color:#38bdf8;font-weight:700;text-transform:uppercase;">SECURE ACCESS CODE</div>
          <div style="font-size:40px;font-weight:900;letter-spacing:8px;color:#38bdf8;font-family:monospace;">__CODE__</div></div>
          <p style="margin:0 0 16px;font-size:13px;line-height:1.6;color:#94a3b8;">This code is valid for a short time. Never share it. NovaWallet will never ask for your recovery phrase or private key.</p>
          <p style="margin:0 0 22px;font-size:12px;line-height:1.5;color:#64748b;border-left:2px solid #f43f5e;padding-left:12px;">If you did not request this code, you can safely ignore this email.</p>
          <div style="padding-top:20px;border-top:1px solid #1e293b;font-size:13px;color:#94a3b8;text-align:center;">Best regards,<br><strong style="color:#fff;">NovaWallet Security Team</strong></div></div>"""
          html = html.replace("__CODE__", code)

          text = (
              "Your NovaWallet verification code is: " + code + "\n\n"
              "Never share this code. NovaWallet will never ask for your recovery phrase or private key.\n\n"
              "If you did not request it, ignore this email."
          )

          msg = MIMEMultipart("alternative")
          msg["Subject"] = "Your NovaWallet verification code"
          msg["From"] = "NovaWallet <" + user + ">"
          msg["To"] = to_email
          msg["Reply-To"] = user
          msg["Date"] = formatdate(localtime=True)
          msg["Message-ID"] = make_msgid(domain="gmail.com")
          msg.attach(MIMEText(text, "plain", "utf-8"))
          msg.attach(MIMEText(html, "html", "utf-8"))

          with smtplib.SMTP("smtp.gmail.com", 587, timeout=30) as server:
              server.ehlo()
              server.starttls(context=ssl.create_default_context())
              server.ehlo()
              server.login(user, password)
              server.sendmail(user, [to_email], msg.as_string())

          print("Verification email sent")
          PY
